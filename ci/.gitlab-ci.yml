stages:
  - compile
  - python
  - test
  - static-test
  - publish

# Fall back to the runner's cached image if the registry rate-limits pulls (HTTP 429)
.pull-policy: &pull_policy
  pull_policy: [always, if-not-present]

image:
  name: $CI_REGISTRY/tum-cps/commonroad-docker/ci-base:2025.2
  <<: *pull_policy

before_script:
  - git config --global url."https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.lrz.de/".insteadOf "git@gitlab.lrz.de:"
  - git config --global url."https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.lrz.de".insteadOf "ssh://git@gitlab.lrz.de"

### static test ###
clang-tidy:
  stage: static-test
  script: ./ci/clang-tidy.sh
  needs:
    - job: build-compile-commands
      artifacts: true

cppcheck:
  stage: static-test
  script:
    cppcheck
    --project=build/compile_commands.json
    -iexternal
    -ibuild/_deps
  needs:
    - job: build-compile-commands
      artifacts: true

pre_commit:
  image: python:3.11
  stage: static-test
  before_script:
    - pip install pre-commit
  script:
    - pre-commit run --all-files --show-diff-on-failure
  needs: []

.cache-build-dir:
  cache: &cache_dependency_archives
    key: cache-dependency-archives
    paths:
      - build/_deps/*-subbuild/*-populate-prefix/src/*.{tar*,zip}
    policy: pull

generate-cache:
  stage: compile
  cache:
    <<: *cache_dependency_archives
    policy: push
  script:
    - cmake -G "Ninja Multi-Config" -S . -B build -DFETCHCONTENT_QUIET:BOOL=OFF
  needs: []

### build project ###
build-compile-commands:
  stage: compile
  script:
    # run CMake in order to get compile_commands.json
    - cmake -G "Ninja Multi-Config" -S . -B build
      -DCMAKE_INSTALL_PREFIX=/commonroad/dist
      -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
    - cmake --build build --target commonroad_protobuf
  needs: []
  artifacts:
    paths:
      - ./build
    expire_in: 20 minutes

build-ubuntu2204:
  stage: compile
  cache:
    <<: *cache_dependency_archives
  image:
    name: $CI_REGISTRY/tum-cps/commonroad-docker/ci-ubuntu2204:2025.2
    <<: *pull_policy
  script:
    - cmake -G "Ninja Multi-Config" -S . -B build
    - cmake --build build --config Release
  needs: []

build-clang:
  stage: compile
  cache:
    <<: *cache_dependency_archives
  image:
    name: $CI_REGISTRY/tum-cps/commonroad-docker/ci-clang:2025.2
    <<: *pull_policy
  parallel:
    matrix:
      - CLANG_VERSION: [15, 16, 17, 18, 19]
  variables:
    CC: clang-$CLANG_VERSION
    CXX: clang++-$CLANG_VERSION
  script:
    - apt-get remove -y libomp-dev &&
      apt-get update &&
      apt-get install -y --no-install-recommends libomp-$CLANG_VERSION-dev
    - cmake -G "Ninja Multi-Config" -S . -B build
    - cmake --build build --config Release
  needs: []

build-gcc:
  stage: compile
  cache:
    <<: *cache_dependency_archives
  image:
    name: $CI_REGISTRY/tum-cps/commonroad-docker/ci-gcc:2025.2
    <<: *pull_policy
  parallel:
    matrix:
      - GCC_VERSION: [10, 11, 12, 13, 14]
  variables:
    CC: x86_64-linux-gnu-gcc-$GCC_VERSION
    CXX: x86_64-linux-gnu-g++-$GCC_VERSION
  script:
    - cmake -G "Ninja Multi-Config" -S . -B build
    - cmake --build build --config Release
  needs: []

build-standalone:
  stage: compile
  cache:
    <<: *cache_dependency_archives
  script:
    - cmake -G "Ninja Multi-Config" -S . -B build
    - cmake --build build --config Release --target env_model_example_node
  needs: []

build-test:
  stage: compile
  cache:
    <<: *cache_dependency_archives
  script:
    - cmake -G "Ninja Multi-Config" -S . -B build
    - cmake --build build --config RelWithDebInfo --target env_model_test
  needs: []
  artifacts:
    paths:
      - build
    expire_in: 30 minutes

build-coverage:
  stage: compile
  cache:
    <<: *cache_dependency_archives
  script:
    - cmake -G "Ninja Multi-Config" -S . -B build -DENV_MODEL_BUILD_CODE_COVERAGE=ON
    - cmake --build build --config RelWithDebInfo --target env_model_test
  needs: []
  artifacts:
    paths:
      - build
    expire_in: 30 minutes

build-sdist:
  stage: compile
  image:
    name: $CI_REGISTRY/tum-cps/commonroad-docker/wheelenv:2025.2
    <<: *pull_policy
  script:
    - python3 --version
    - git describe
    - python3 -m build --sdist
  variables:
    # Necessary so that Git detects all tags
    GIT_STRATEGY: clone
    GIT_DEPTH: 0
    GIT_FETCH_EXTRA_FLAGS: --tags
  artifacts:
    paths:
      - dist/*.tar.gz
    expire_in: 360 minutes

### tests ###
test:
  stage: test
  script:
    - cmake --build build --config RelWithDebInfo --target test
  needs:
    - job: build-test
      artifacts: true
  artifacts:
    # Upload reports even if tests fail
    when: always
    reports:
      junit: build/test-reports/*.xml
    expire_in: 30 minutes

run-coverage:
  stage: test
  script:
    - cmake --build build --config RelWithDebInfo --target env_model_coverage
    - gcovr --version
    - gcovr
      -f src/
      -e build/
      --print-summary
      --exclude-unreachable-branches
      --output coverage.xml
      --xml
    - mv build/env_model_coverage coverage-report
  needs:
    - job: build-coverage
      artifacts: true
  coverage: /^\s*lines:\s*\d+.\d+\%/
  artifacts:
    paths:
      - coverage-report
    expose_as: 'Coverage Report'
    expire_in: 30 minutes
    reports:
      coverage_report:
          coverage_format: cobertura
          path: coverage.xml

.install-python-venv: &install-python-venv
    - apt-get update && apt-get install -y --no-install-recommends git python3-venv python3-pip ffmpeg libsm6 libxext6 build-essential git pkg-config wget libomp-dev gcovr doxygen graphviz cppcheck libeigen3-dev libboost-all-dev uuid-dev libcgal-dev libspdlog-dev ffmpeg default-jre default-jdk gcc
    - git config --global url."https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.lrz.de/".insteadOf "git@gitlab.lrz.de:"
    - git config --global url."https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.lrz.de".insteadOf "ssh://git@gitlab.lrz.de"
    - python3 -m pip config set global.disable-pip-version-check true
    - python3 -m venv test-venv
    - source test-venv/bin/activate
    - python3 -m pip install pip-tools

test-python-general:
  stage: test
  image: python:${JOB_PYTHON_VERSION}-slim-bookworm
  parallel:
    matrix:
      - JOB_PYTHON_VERSION: [ "3.9", "3.10", "3.11" ]
  before_script:
    - *install-python-venv
    - python -m pip install ".[test]"
  script:
    - python -m pytest --junit-xml=pytest-report.xml tests/python
  needs: []
  artifacts:
    reports:
      junit: pytest-report.xml
    expire_in: 30 minutes

pages:
  stage: publish
  image: python:3.11-slim-bookworm
  when: manual
  publish: site
  before_script:
    - *install-python-venv
  script:
    - pip install ".[docs]"
    - mkdocs build
  artifacts:
    paths:
      - site
  environment:
    name: Gitlab Pages
    url: https://cps.pages.gitlab.lrz.de/commonroad/environment-model/
  needs: []

build_pages:
  stage: publish
  image: python:3.11-slim-bookworm
  before_script:
    - *install-python-venv
  script:
    - pip install ".[docs]"
    - mkdocs build
  artifacts:
    paths:
      - site
  needs: []
